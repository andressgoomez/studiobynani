services:
  - type: web
    name: studiobynani
    runtime: node
    plan: 0.5c-512mb
    region: ohio
    disk:
      name: studiobynani-data
      mountPath: /opt/render/project/src/prisma/data
      sizeGB: 1
    buildCommand: npm install --include=dev && npx prisma generate && npm run build --workspace @studiobynani/web
    startCommand: node -e "require('node:fs').mkdirSync('prisma/data',{recursive:true})" && npx prisma db push --skip-generate --accept-data-loss && npx tsx apps/api/src/server.ts
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SERVE_WEB
        value: "true"
      - key: DATABASE_URL
        value: file:./data/studiobynani.sqlite
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: SESSION_SECRET
        generateValue: true
